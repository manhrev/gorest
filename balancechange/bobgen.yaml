sql:
   dialect: psql
   driver: github.com/jackc/pgx/v5/stdlib
   uuid_pkg: google
   pattern: "migrations/*.sql"
type_system: database/sql
replacements:
  - match:
      db_type: "uuid"
    replace: "string"
plugins:
  dbinfo:
    destination: ./internal/db/dbinfo
  enums:
    destination: ./internal/db/enum
    pkgname: enum
  models:
    destination: ./internal/db/model
    pkgname: model
  factory:
    disabled: true
  dberrors:
    destination: ./internal/db/dberror
    pkgname: dberror
